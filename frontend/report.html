<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report a Problem - Hardware Maintenance</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>Hardware Maintenance Request System</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="track.html">Track My Request</a>
    <a href="login.html">Admin Login</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>Report a Hardware Problem</h2>
    <form id="reportForm">
      <label for="reporter_name">Your Full Name</label>
      <input type="text" id="reporter_name" required />

      <label for="department">Department / Class</label>
      <input type="text" id="department" placeholder="e.g. ICT Department" />

      <label for="equipment_name">Equipment Name</label>
      <input type="text" id="equipment_name" placeholder="e.g. HP Desktop Computer" required />

      <label for="location">Location / Room</label>
      <input type="text" id="location" placeholder="e.g. Computer Lab 2" required />

      <label for="priority">Priority</label>
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <label for="issue_description">Describe the Problem</label>
      <textarea id="issue_description" required></textarea>

      <button type="submit">Submit Request</button>
      <div id="formMessage"></div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/report.js"></script>
</body>
</html>
