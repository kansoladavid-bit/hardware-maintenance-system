<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report a Problem - Hardware Maintenance</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6l-3 3-4.3-4.3C.6 7.1 1 10.1 3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z"/></svg><h1>Hardware Maintenance Request System</h1></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="track.html">Track My Request</a>
    <a href="login.html">Admin Login</a>
  </nav>
</header>
<div class="container">
  <div class="card">
    <h2>Report a Hardware Problem</h2>
    <form id="reportForm">
      <label for="reporter_name">Your Full Name</label>
      <input type="text" id="reporter_name" required />
      <label for="department">Department / Class</label>
      <input type="text" id="department" placeholder="e.g. ICT Department" />
      <label for="contact_info">Phone Number or Email</label>
      <input type="text" id="contact_info" placeholder="e.g. 0755123456 or you@email.com" required />
      <label for="equipment_name">Equipment Name</label>
      <input type="text" id="equipment_name" placeholder="e.g. HP Desktop Computer" required />
      <label for="location">Location / Room</label>
      <input type="text" id="location" placeholder="e.g. Computer Lab 2" required />
      <label for="priority">Priority</label>
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <label for="issue_description">Describe the Problem</label>
      <textarea id="issue_description" required></textarea>
      <button type="submit">Submit Request</button>
      <div id="formMessage"></div>
    </form>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/report.js"></script>
</body>
</html>
