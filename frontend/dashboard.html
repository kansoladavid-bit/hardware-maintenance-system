<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - Hardware Maintenance</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6l-3 3-4.3-4.3C.6 7.1 1 10.1 3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z"/></svg><h1>Hardware Maintenance Request System</h1></div>
  <nav>
    <span id="welcomeUser" style="margin-right:14px;"></span>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
</header>

<div class="container" style="max-width: 1100px;">

  <div class="stats-grid" id="statsGrid">
    <div class="stat-box"><div class="num" id="statTotal">-</div><div class="lbl">Total Requests</div></div>
    <div class="stat-box"><div class="num" id="statPending">-</div><div class="lbl">Pending</div></div>
    <div class="stat-box"><div class="num" id="statInProgress">-</div><div class="lbl">In Progress</div></div>
    <div class="stat-box"><div class="num" id="statResolved">-</div><div class="lbl">Resolved</div></div>
  </div>
  <div class="card">
    <h2>All Maintenance Requests</h2>

    <div class="filters">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <select id="filterPriority">
        <option value="">All priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <input type="text" id="filterSearch" placeholder="Search equipment, department, location..." />
      <button id="applyFilters" style="margin-top:0;">Filter</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Ref Code</th>
          <th>Reporter</th>
          <th>Contact</th>
          <th>Equipment</th>
          <th>Location</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Reported</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="requestsTableBody">
        <tr><td colspan="10">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
